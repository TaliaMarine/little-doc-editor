server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # The stock mime.types has no .mjs; browsers refuse module workers (pdf.js)
  # served as octet-stream. Re-declare the defaults plus .mjs for this server.
  include /etc/nginx/mime.types;
  types { text/javascript mjs; }

  # add_header in a location replaces inherited ones, so every location
  # includes the generated CSP/nosniff/Referrer-Policy (docker/40-lde-config.sh).

  # Hashed build assets are immutable; index.html must always be revalidated.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # Runtime config is generated per container start; never cache it (the
  # service worker does not cache anything either).
  location = /config.js {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-store";
  }
  # Share/invite tokens are bearer credentials in the URL path: serve the SPA
  # shell for them without writing the path to the access log.
  location ~ ^/(share|invite)/ {
    access_log off;
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }
  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
