# Local development infrastructure only — Postgres, Redis, and MinIO
# (S3-compatible) are all bring-your-own in production (Decisions 18, 29, 5);
# this compose file exists purely so contributors don't need to provision
# any of them by hand for local runs. Never used in production.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: little_doc_editor
    ports:
      - "5432:5432"
    volumes:
      - little-doc-editor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for local attachment upload testing
  # (SPEC.md Decision 5 explicitly allows MinIO as one of the S3-API options).
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - little-doc-editor-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot: creates the attachments bucket on first run. Exits after
  # succeeding; safe to leave in `docker compose up` since it no-ops if the
  # bucket already exists.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/little-doc-editor-attachments
      "

volumes:
  little-doc-editor-postgres:
  little-doc-editor-minio:
