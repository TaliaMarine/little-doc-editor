{{- range $component, $spec := (dict "api" .Values.api "frontend" .Values.frontend "collab" .Values.collab) }}
{{- if $spec.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "little-doc-editor.fullname" $ }}-{{ $component }}
  labels:
    {{- include "little-doc-editor.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "little-doc-editor.fullname" $ }}-{{ $component }}
  minReplicas: {{ $spec.autoscaling.minReplicas }}
  maxReplicas: {{ $spec.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $spec.autoscaling.targetCPUUtilizationPercentage }}
---
{{- end }}
{{- end }}
