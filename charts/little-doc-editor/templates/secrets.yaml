{{/*
Materializes any credential-shaped value that was set inline (via `.value`)
into a Secret object this chart manages, rather than injecting it as a plain
env var (per the eso-secret-value convention). Fields using
`existingSecret.name` instead are skipped here entirely — this Secret never
fights one ESO (or the operator) manages directly.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "little-doc-editor.fullname" . }}-generated
  labels:
    {{- include "little-doc-editor.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.postgres.dsn.value (not .Values.postgres.dsn.existingSecret.name) }}
  postgres-dsn: {{ .Values.postgres.dsn.value | quote }}
  {{- end }}
  {{- if and .Values.redis.auth.value (not .Values.redis.auth.existingSecret.name) }}
  redis-auth: {{ .Values.redis.auth.value | quote }}
  {{- end }}
  {{- if and .Values.s3.accessKey.value (not .Values.s3.accessKey.existingSecret.name) }}
  s3-access-key: {{ .Values.s3.accessKey.value | quote }}
  {{- end }}
  {{- if and .Values.s3.secretKey.value (not .Values.s3.secretKey.existingSecret.name) }}
  s3-secret-key: {{ .Values.s3.secretKey.value | quote }}
  {{- end }}
  {{- if and .Values.oidc.clientSecret.value (not .Values.oidc.clientSecret.existingSecret.name) }}
  oidc-client-secret: {{ .Values.oidc.clientSecret.value | quote }}
  {{- end }}
  {{- if and .Values.sessionJWT.value (not .Values.sessionJWT.existingSecret.name) }}
  session-jwt-secret: {{ .Values.sessionJWT.value | quote }}
  {{- end }}
  {{- if and .Values.bootstrapAdmin.password.value (not .Values.bootstrapAdmin.password.existingSecret.name) }}
  bootstrap-admin-password: {{ .Values.bootstrapAdmin.password.value | quote }}
  {{- end }}
