apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "little-doc-editor.fullname" . }}-frontend
  labels:
    {{- include "little-doc-editor.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "little-doc-editor.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "little-doc-editor.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.imageRegistry }}{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
          {{- $apiUrl := include "little-doc-editor.frontendApiBaseUrl" . }}
          {{- $collabUrl := include "little-doc-editor.frontendCollabUrl" . }}
          {{- if or $apiUrl $collabUrl }}
          env:
            {{- if $apiUrl }}
            - name: API_BASE_URL
              value: {{ $apiUrl | quote }}
            {{- end }}
            {{- if $collabUrl }}
            - name: COLLAB_URL
              value: {{ $collabUrl | quote }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "little-doc-editor.fullname" . }}-frontend
  labels:
    {{- include "little-doc-editor.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: {{ include "little-doc-editor.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
