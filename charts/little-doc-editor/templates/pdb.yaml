{{- range $component, $spec := (dict "api" .Values.api "frontend" .Values.frontend "collab" .Values.collab) }}
{{- if $spec.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "little-doc-editor.fullname" $ }}-{{ $component }}
  labels:
    {{- include "little-doc-editor.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  minAvailable: {{ $spec.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "little-doc-editor.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
---
{{- end }}
{{- end }}
