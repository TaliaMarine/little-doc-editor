# Example ExternalSecret manifests producing the Secret shape this chart's
# `existingSecret` fields expect (SPEC.md Decision 19). Apply these alongside
# the chart rather than setting the inline `value` fields in values.yaml.
#
# Each `target.name` below should then be referenced from values.yaml, e.g.:
#
#   postgres:
#     dsn:
#       existingSecret:
#         name: little-doc-editor-postgres
#         key: dsn

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: little-doc-editor-postgres
spec:
  secretStoreRef:
    name: my-secret-store
    kind: SecretStore
  target:
    name: little-doc-editor-postgres
  data:
    - secretKey: dsn
      remoteRef:
        key: little-doc-editor/postgres-dsn
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: little-doc-editor-redis
spec:
  secretStoreRef:
    name: my-secret-store
    kind: SecretStore
  target:
    name: little-doc-editor-redis
  data:
    - secretKey: auth
      remoteRef:
        key: little-doc-editor/redis-auth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: little-doc-editor-s3
spec:
  secretStoreRef:
    name: my-secret-store
    kind: SecretStore
  target:
    name: little-doc-editor-s3
  data:
    - secretKey: accessKey
      remoteRef:
        key: little-doc-editor/s3-access-key
    - secretKey: secretKey
      remoteRef:
        key: little-doc-editor/s3-secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: little-doc-editor-oidc
spec:
  secretStoreRef:
    name: my-secret-store
    kind: SecretStore
  target:
    name: little-doc-editor-oidc
  data:
    - secretKey: clientSecret
      remoteRef:
        key: little-doc-editor/oidc-client-secret
---
# Shared between api and collab — both must resolve to the exact same
# value (SPEC.md §4), so there's one ExternalSecret/Secret for it, not one
# per service.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: little-doc-editor-session-jwt
spec:
  secretStoreRef:
    name: my-secret-store
    kind: SecretStore
  target:
    name: little-doc-editor-session-jwt
  data:
    - secretKey: secret
      remoteRef:
        key: little-doc-editor/session-jwt-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: little-doc-editor-bootstrap-admin
spec:
  secretStoreRef:
    name: my-secret-store
    kind: SecretStore
  target:
    name: little-doc-editor-bootstrap-admin
  data:
    - secretKey: password
      remoteRef:
        key: little-doc-editor/bootstrap-admin-password
