# little-doc-editor Helm chart values.
#
# This chart never bundles Postgres or Redis (Decisions 18, 29) — it only
# ever consumes connection secrets for externally provisioned instances.
# Every credential-shaped value below supports EITHER an inline `value` OR a
# reference to an existing Kubernetes Secret via `existingSecret.{name,key}`
# (Decision 19), so it composes with the External Secrets Operator without
# the chart fighting an ESO-managed Secret. See docs/external-secrets-example.yaml.

imageRegistry: ""
imagePullSecrets: []

# --- External PostgreSQL (Decision 18: bring-your-own only) ---
postgres:
  # Full pgx-compatible DSN, credential-shaped: inline OR existingSecret.
  dsn:
    value: ""
    existingSecret:
      name: ""
      key: ""

# --- External Redis (Decisions 3, 20, 29: bring-your-own, collab fan-out + shared session/presence state) ---
redis:
  addr: ""   # host:port, not secret-shaped
  # ACL username (REDIS_USERNAME) for api and collab; empty = the default user.
  username: ""
  # Connect with TLS (REDIS_TLS) — set true for managed Redis that requires it.
  tls: false
  # Redis AUTH password, passed to collab (fan-out) and api (shared rate
  # limiter) as REDIS_PASSWORD. Leave empty for a Redis without auth.
  # (collab also accepts REDIS_URL / rediss://, but this chart only wires the
  # discrete addr/username/tls/auth fields.)
  auth:
    value: ""
    existingSecret:
      name: ""
      key: ""

# --- Attachment storage backend ---
# "s3" (default, Decision 5) uses the s3.* values below. "filesystem" keeps
# attachment bytes on a PersistentVolumeClaim mounted into the api pods
# (api.persistence) — for small installs without an object store. A ReadWriteOnce
# volume only supports a single api replica; use ReadWriteMany storage to scale out.
storage:
  backend: s3

# --- S3-compatible object storage (Decision 5, used when storage.backend=s3) ---
s3:
  endpoint: ""
  bucket: ""   # required — api refuses to start without it
  region: ""
  # true for MinIO and most non-AWS S3-compatible stores; set false for AWS
  # S3 virtual-hosted-style addressing.
  usePathStyle: true
  accessKey:
    value: ""
    existingSecret:
      name: ""
      key: ""
  secretKey:
    value: ""
    existingSecret:
      name: ""
      key: ""

# --- OIDC (Decision 14: single instance-wide issuer) ---
oidc:
  enabled: false
  issuer: ""
  clientID: ""
  # OPTIONAL. Leave empty (the default) for a public client that authenticates
  # with PKCE only — no secret is sent or stored. Only set this if your
  # identity provider insists on a confidential client.
  clientSecret:
    value: ""
    existingSecret:
      name: ""
      key: ""
  # This deployment's own OIDC callback URL, registered with the identity
  # provider, e.g. https://docs.example.com/api/v1/auth/oidc/callback.
  redirectURL: ""
  # Where the browser lands after login (defaults to /auth/callback on the
  # redirectURL's origin).
  postLoginURL: ""
  # Members of this IdP group become org admins (re-evaluated at every login;
  # leaving the group demotes). Empty disables the mapping.
  adminGroup: ""
  # ID-token claim that lists the user's groups.
  groupsClaim: groups

# Implicit space role of EVERY signed-in user in every space: "" (none),
# "viewer" or "editor". Explicit space memberships still apply when higher.
# Applied by both api and collab.
defaultMemberRole: ""

# --- Session signing (shared between api and collab, SPEC.md §4) ---
# api issues session tokens (login, share-link redemption); collab validates
# the same tokens on WS connect before letting a client join a document
# room — both MUST use the identical secret, hence one shared value here
# rather than two independent per-service fields.
sessionJWT:
  value: ""
  existingSecret:
    name: ""
    key: ""
  # How long an issued session token stays valid.
  ttl: 24h

# --- Bootstrap admin (Decision 11: admin-invite-only signup) ---
# Creates the first internal org-admin account on startup if one doesn't
# already exist — idempotent, safe to leave set across upgrades. Needed
# because admin-invite-only signup means someone has to send the first
# invite; this is that first account. Leave email empty to disable.
bootstrapAdmin:
  email: ""
  password:
    value: ""
    existingSecret:
      name: ""
      key: ""

# --- api service ---
api:
  replicaCount: 2
  image:
    repository: ghcr.io/taliamarine/little-doc-editor-api
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  logLevel: info
  # PVC for attachment bytes when storage.backend=filesystem.
  persistence:
    size: 10Gi
    storageClassName: ""
    accessModes: [ReadWriteOnce]
    existingClaim: ""
    mountPath: /data/attachments
  # Attachment upload policy (Decision 17). An empty allowlist keeps the
  # api's built-in default (images, PDF, common Office formats, zip, plain
  # text/code); entries are sniffed MIME types, e.g. ["image/png",
  # "application/pdf"].
  attachments:
    allowlist: []
    maxSizeBytes: 26214400   # 25MB
  # Break-glass path to re-enable internal login if OIDC misconfigures
  # (Decision 14) — an env var/CLI flag on the pod, never a DB-only toggle.
  # Restores password login for the BOOTSTRAP ADMIN ONLY (bootstrapAdmin.email,
  # which must therefore be set) — other internal accounts stay blocked.
  internalLoginBreakGlass: false
  # In-process history cleanup job (Decisions 9, 28): standard 5-field cron,
  # "@daily" / "@every 6h", or "off". Several replicas are fine — a Postgres
  # advisory lock lets one run per tick. The schedule is validated at startup.
  historyCleanupSchedule: "0 3 * * *"
  # Minimum gap between two auto-created revisions of a page by the same author.
  revisionDebounce: 5m
  # Reverse proxies whose X-Forwarded-For is trusted (CIDRs or IPs), used for
  # rate limiting and the hashed share-link access-log IP. Set this to your
  # ingress controller / gateway pod CIDR; empty (default) ignores the header,
  # which makes every client look like the ingress.
  trustedProxies: []
  # Browser origins allowed to call the api cross-origin (CORS_ALLOWED_ORIGINS;
  # exact origins like https://docs.example.com, never "*"; no cookies are
  # involved, the api uses a bearer token). Empty (default) = derived: the
  # frontend origin(s) from ingress.frontend.host / gatewayApi.frontend.hostnames
  # when the api is published on a different host than the frontend, otherwise
  # CORS stays off (same-origin).
  corsAllowedOrigins: []
  # Rate limiting for login, share-link and invite redemption (SPEC.md §8).
  # Counters live in Redis (redis.addr) so limits hold across replicas; if
  # Redis is down it falls back to per-replica in-process counters.
  rateLimit:
    enabled: true
    loginPerMinute: 10       # per client IP, POST /auth/login
    publicPerMinute: 30      # per client IP, per endpoint class (share, invite, SSO)
  # Prometheus /metrics on a dedicated port (api only: never routed through
  # the ingress/HTTPRoute). Must differ from service.port. The ServiceMonitor
  # below scrapes it.
  metrics:
    enabled: true
    port: 9090

# --- frontend service ---
frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/taliamarine/little-doc-editor-frontend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  # Runtime config served to the SPA as /config.js and folded into its
  # Content-Security-Policy connect-src/img-src at container start. Left empty,
  # the URLs are derived from ingress.{api,collab}.host (scheme from the tls
  # toggle) or gatewayApi.{api,collab}.hostnames (https assumed); if neither is
  # set the SPA uses same-origin /api/v1 and /collab. Set these to override.
  # NOTE: a different api origin needs CORS on the api: see api.corsAllowedOrigins
  # (derived automatically from the ingress/gateway hosts).
  config:
    apiBaseUrl: ""   # e.g. https://api.docs.example.com/api/v1
    collabUrl: ""    # e.g. wss://collab.docs.example.com
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# --- collab service ---
collab:
  replicaCount: 2
  image:
    repository: ghcr.io/taliamarine/little-doc-editor-collab
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 1234
  # Prometheus /metrics on a dedicated port (never routed through the
  # ingress/HTTPRoute). Must differ from service.port.
  metrics:
    enabled: true
    port: 9091
  # Browser origins allowed to open the collab WebSocket (COLLAB_ALLOWED_ORIGINS;
  # a handshake carrying any other Origin gets 403; no Origin = non-browser,
  # left to token auth). Empty (default) = the frontend origin(s) derived from
  # ingress.frontend.host / gatewayApi.frontend.hostnames; if those are unset
  # too, no origin check.
  allowedOrigins: []
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # collab holds in-memory CRDT room state per replica (§7.4) — sticky
  # sessions are the operator's responsibility for their ingress
  # controller/Gateway class (Decision 25); this chart doesn't enforce it.
  # Add the relevant annotation/policy for your controller here or via
  # ingress.annotations / gatewayApi, e.g. for nginx:
  #   nginx.ingress.kubernetes.io/affinity: cookie
  stickySessionsNote: "See the top-level sessionJWT value — operator-configured sticky sessions, not chart-enforced."

# --- Ingress (vendor-neutral: no controller-specific defaults, Decision 25) ---
ingress:
  enabled: false
  className: ""
  annotations: {}
  frontend:
    host: ""
    tls:
      enabled: false
      secretName: ""
  api:
    host: ""
    # api/collab routes carry WS upgrades (the presence channel in api, and
    # the full Yjs stream in collab) — set your controller's WS-upgrade
    # timeouts/annotations here, e.g. for nginx:
    #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    annotations: {}
    tls:
      enabled: false
      secretName: ""
  collab:
    host: ""
    annotations: {}
    tls:
      enabled: false
      secretName: ""

# --- Gateway API (independent toggle from ingress, Decision 25) ---
gatewayApi:
  enabled: false
  gatewayRef:
    name: ""
    namespace: ""
  frontend:
    hostnames: []
  api:
    hostnames: []
    # See ingress.api's comment above — the same WS-upgrade-friendly timeout
    # concern applies here via your Gateway class's policy attachment.
  collab:
    hostnames: []

# --- Observability (Decision 27) ---
observability:
  serviceMonitor:
    # Only created if the Prometheus Operator CRD is actually present in
    # the cluster (checked via .Capabilities in templates/servicemonitor.yaml)
    # AND this is enabled — the two are independent gates on purpose.
    # Scrapes api (`metrics` port, needs api.metrics.enabled) and collab
    # (`metrics` port, path /metrics).
    enabled: false
    interval: 30s
  otel:
    enabled: false
    endpoint: ""   # OTLP exporter endpoint, e.g. http://otel-collector.observability:4318
    # OTLP transport used by the api: "http/protobuf" (default; port 4318) or
    # "grpc" (port 4317). Auth headers / TLS use the standard OTEL_EXPORTER_OTLP_*
    # environment variables.
    protocol: http/protobuf
